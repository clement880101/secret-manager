# Copy to 00-secret.yaml, fill in, and keep it out of version control.
#
#   kubectl create secret generic secretmgr \
#     --from-literal=SECRET_ENCRYPTION_KEY="$(docker run --rm \
#       ghcr.io/clement880101/secret-manager:latest \
#       python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
#     --from-literal=POSTGRES_PASSWORD='choose-one' \
#     --from-literal=BOOTSTRAP_TOKEN='choose-one'
apiVersion: v1
kind: Secret
metadata:
  name: secretmgr
type: Opaque
stringData:
  # Encrypts secret values at rest. Losing it makes existing values unreadable.
  SECRET_ENCRYPTION_KEY: replace-me
  POSTGRES_PASSWORD: replace-me
  # Every replica must agree on the first token. Without a fixed value each
  # would mint its own on the way up and only one would be the one you hold.
  BOOTSTRAP_TOKEN: replace-me
