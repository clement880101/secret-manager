# Self-hosting stack: the API plus a durable Postgres.
#
# This is not the repository's root docker-compose.yml, which exists to back
# the Dev Containers and deliberately runs `sleep infinity` instead of the app.
#
#   cp .env.example .env   # then fill it in
#   docker compose up -d
#
# Put this behind something that terminates TLS (a reverse proxy, or whatever
# your platform provides). The API speaks plain HTTP by design, so it can run
# anywhere rather than owning certificates itself.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretmgr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-secretmgr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secretmgr}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    # Published image, or built locally if you have the source checked out.
    image: ghcr.io/clement880101/secret-manager:latest
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: postgresql+psycopg://${POSTGRES_USER:-secretmgr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-secretmgr}
      # Without this, secret values are stored unencrypted.
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:?set SECRET_ENCRYPTION_KEY in .env}
      # This deployment has its own accounts. There is no identity provider to
      # configure and nothing to register anywhere: the three GitHub OAuth
      # variables that used to be required here are not read by the service at
      # all any more, and demanding them stopped `docker compose up` before it
      # started.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      ADMIN_USERS: ${ADMIN_USERS:-}
      TOKEN_TTL_DAYS: ${TOKEN_TTL_DAYS:-0}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-0}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
