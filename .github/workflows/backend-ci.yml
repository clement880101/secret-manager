name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    # A real database, because the concurrency tests need genuine concurrent
    # writers. SQLite serialises them and would pass for code that is not
    # actually safe to run on more than one replica.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sm
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://sm:secret@postgres:5432/sm

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            build-essential \
            libffi-dev \
            libssl-dev \
            sqlite3
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  image:
    name: Build container image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Needed to build arm64 on an amd64 runner. Only on main, because the
      # emulation is slow and a pull request only needs to know the image
      # builds and runs at all.
      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Pull requests build without pushing: the point is to find a broken
      # Dockerfile before it is merged, not to publish from a branch. Until
      # this existed the image was only ever built when cutting a release, so
      # a Dockerfile change could sit broken on main until then.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Both architectures when publishing, or the tag cannot be pulled on
          # Apple silicon, Graviton or a Pi. A pull request builds only the
          # runner's own architecture, which is all a smoke test needs.
          platforms: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          # main and the commit sha, never :latest -- that belongs to releases,
          # so pulling :latest always gets a tagged version rather than a
          # moving branch.
          tags: |
            ghcr.io/${{ github.repository }}:main
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image actually runs
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: |
          docker build -t secretmgr-ci backend
          docker run -d --name ci-check -p 8000:8000 secretmgr-ci
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/healthz || { docker logs ci-check; exit 1; }
          # It must not run as root.
          test "$(docker exec ci-check id -u)" = "10001"
          docker rm -f ci-check
