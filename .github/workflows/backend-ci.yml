name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim

    # A real database, because the concurrency tests need genuine concurrent
    # writers. SQLite serialises them and would pass for code that is not
    # actually safe to run on more than one replica.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sm
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+psycopg://sm:secret@postgres:5432/sm

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git \
            build-essential \
            libffi-dev \
            libssl-dev \
            sqlite3
          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: pytest
