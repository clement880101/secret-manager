name: Integration Tests

on:
  workflow_run:
    workflows:
      - Backend CI
      - CLI CI
    types:
      - completed
  push:
    paths:
      - .github/workflows/integration-tests.yml
      - integration-tests/**
      - cli/**
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - integration-tests/**
      - cli/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-integration-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_ACCESS_TOKEN_1: ${{ secrets.GH_ACCESS_TOKEN_1 }}
      GH_ACCESS_TOKEN_2: ${{ secrets.GH_ACCESS_TOKEN_2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The binary is built here rather than downloaded from another workflow's
      # artifacts. The previous approach looked up the most recent successful
      # CLI CI run and pulled its artifact, which broke permanently once that
      # run aged past the 30-day artifact retention: the download failed with
      # "Artifact has expired" and no CLI CI run had happened since to replace
      # it. Building from the checkout also means these tests exercise the code
      # under review instead of whatever was last released.
      - name: Install CLI dependencies
        working-directory: cli
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build CLI binary
        working-directory: cli
        run: pyinstaller --onefile --name cli cli.py

      - name: Stage binary for the test suite
        run: |
          cp cli/dist/cli integration-tests/cli
          chmod +x integration-tests/cli
          ./integration-tests/cli --help > /dev/null

      - name: Install test dependencies
        working-directory: integration-tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run integration tests
        working-directory: integration-tests
        run: pytest
