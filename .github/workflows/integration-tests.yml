name: Integration Tests

on:
  workflow_run:
    workflows:
      - Backend CI
      - CLI CI
    types:
      - completed
  push:
    paths:
      - .github/workflows/integration-tests.yml
      - integration-tests/**
      - cli/**
      - backend/**
  pull_request:
    paths:
      - .github/workflows/integration-tests.yml
      - integration-tests/**
      - cli/**
      - backend/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-integration-tests:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: http://127.0.0.1:8000

    # The suite drives the real CLI against a real backend on a real database.
    # That backend is started here rather than pointed at the deployed one:
    # testing against production made these runs depend on how production
    # happened to be configured, and they broke the moment /auth/login-test was
    # correctly disabled there.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: sm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt

      # The real application, unmodified. Nothing is stubbed: the service
      # manages its own accounts, so the suite registers the identities it needs.
      - name: Start the backend
        env:
          DB_URL: postgresql+psycopg://sm:secret@127.0.0.1:5432/sm
          BACKEND_URL: http://127.0.0.1:8000
        run: |
          SECRET_ENCRYPTION_KEY="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" \
            cd backend && nohup uvicorn app:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/healthz || { cat "$RUNNER_TEMP/backend.log"; exit 1; }

      # Built from this checkout, so the suite exercises the code under review.
      - name: Build the CLI
        working-directory: cli
        run: |
          pip install -r requirements-build.txt
          pyinstaller --onefile --name cli cli.py

      - name: Stage the binary
        run: |
          cp cli/dist/cli integration-tests/cli
          chmod +x integration-tests/cli

      - name: Install test dependencies
        working-directory: integration-tests
        run: pip install -r requirements.txt

      - name: Run integration tests
        working-directory: integration-tests
        run: pytest

      - name: Backend log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log" || true
