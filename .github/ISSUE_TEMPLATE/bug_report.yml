name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`secretmgr version`, or the image tag you are running."
      placeholder: v0.4.0
    validations:
      required: true
  - type: dropdown
    id: auth-mode
    attributes:
      label: Authentication mode
      options: ["local (the default)", "github", "not sure"]
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: ["SQLite (the default)", "Postgres", "not sure"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Server logs help most. Please remove any tokens or secret values first."
      render: shell
